<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>S16 · Отклик</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7759b923ae90366bc47b73b4d5476dfa">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9EBEE}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <header class="tgh">
    <a class="tgh-btn" href="S15-job.dc.html"><svg class="ic i24" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Назад</a>
    <div class="tgh-t"><b>Соседи</b><span>мини-приложение</span></div>
    <button class="tgh-btn r" type="button" aria-label="Меню"><svg class="ic fill i24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <main class="stack" style="padding: 12px 16px 124px; gap: 14px">
    <section class="card tight" aria-labelledby="rsp-job">
      <span class="cap">Отклик на заявку</span>
      <div class="between" style="align-items: flex-start">
        <h1 class="job-t" id="rsp-job">Повесить люстру</h1>
        <span class="price">5&nbsp;000 RSD</span>
      </div>
      <div class="between">
        <span class="meta"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5a7 7 0 1 0-14 0C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Лиман · сегодня 18–21</span>
        <span class="hstack" style="gap: 6px"><span class="slots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><span class="cap">3 из 5</span></span>
      </div>
    </section>

    <div class="fld">
      <div class="between">
        <label class="lbl" for="rsp-msg">Сообщение клиенту</label>
        <a class="link sm" href="S57-templates.dc.html" style="min-height: 44px; display: flex; align-items: center">Мои шаблоны</a>
      </div>
      <textarea class="inp focus" id="rsp-msg" rows="3">Здравствуйте! Могу сегодня в 19:00. Приеду со своим инструментом и стремянкой, соберу и подключу люстру.</textarea>
      <div class="chips" role="group" aria-label="Вставить шаблон">
        <button class="chip acc" type="button">Могу сегодня</button>
        <button class="chip" type="button">Свой инструмент</button>
        <button class="chip" type="button">Сначала посмотрю по фото</button>
      </div>
    </div>

    <div class="fld">
      <span class="lbl" id="rsp-price-lbl">Цена</span>
      <div class="seg" role="group" aria-labelledby="rsp-price-lbl">
        <button class="on" type="button" aria-pressed="true">Фикс</button>
        <button type="button" aria-pressed="false">От</button>
        <button type="button" aria-pressed="false">За час</button>
        <button type="button" aria-pressed="false">Договорная</button>
      </div>
      <div class="inp"><input id="rsp-price" type="text" inputmode="numeric" value="3&nbsp;500" aria-labelledby="rsp-price-lbl"><span class="sfx">RSD</span></div>
    </div>

    <div class="fld">
      <label class="lbl" for="rsp-when">Когда смогу</label>
      <div class="inp">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text2)"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <input id="rsp-when" type="text" value="Сегодня, 19:00">
      </div>
      <p class="hint hstack" style="gap: 6px"><svg class="ic i16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Контакты откроются после договорённости</p>
    </div>

    <div class="between" style="min-height: 44px">
      <label class="hstack" style="gap: 10px">
        <button class="chk" type="button" role="checkbox" aria-checked="false"></button>
        <span>Сохранить как шаблон</span>
      </label>
      <button class="btn sm" type="button" style="background: transparent; color: var(--accent)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Предпросмотр</button>
    </div>
  </main>

  <div class="mbar">
    <a class="mbtn" href="S17-my-responses.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>Отправить отклик</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
