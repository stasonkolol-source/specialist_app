<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>S19 · Новая подписка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7759b923ae90366bc47b73b4d5476dfa">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9EBEE}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <header class="tgh">
    <a class="tgh-btn" href="S18-alerts.dc.html"><svg class="ic i24" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Назад</a>
    <div class="tgh-t"><b>Сосед</b><span>мини-приложение</span></div>
    <button class="tgh-btn r" type="button" aria-label="Меню"><svg class="ic fill i24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <main class="stack" style="padding: 12px 16px 124px; gap: 14px">
    <div class="stack g4">
      <h1 class="h2">Новая подписка</h1>
      <p class="cap">Подходящие заявки придут в чат с ботом</p>
    </div>

    <div class="stack g8">
      <span class="lbl" id="af-cats">Категории</span>
      <div class="chips wrap" role="group" aria-labelledby="af-cats">
        <button class="chip on" type="button" aria-pressed="true"><svg class="ic i16" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Мастер на час</button>
        <button class="chip" type="button" aria-pressed="false">Уборка</button>
        <button class="chip" type="button" aria-pressed="false">Переезды</button>
        <button class="chip" type="button" aria-pressed="false">Бьюти</button>
        <button class="chip" type="button" aria-pressed="false">Репетиторы</button>
      </div>
    </div>

    <div class="stack g8">
      <span class="lbl" id="af-radius">Радиус от Лимана</span>
      <div class="chips" role="group" aria-labelledby="af-radius">
        <button class="chip" type="button" aria-pressed="false">1 км</button>
        <button class="chip on" type="button" aria-pressed="true">3 км</button>
        <button class="chip" type="button" aria-pressed="false">5 км</button>
        <button class="chip" type="button" aria-pressed="false">10 км</button>
      </div>
    </div>

    <div class="fld">
      <label class="lbl" for="af-budget">Бюджет от</label>
      <div class="inp"><input id="af-budget" type="text" inputmode="numeric" value="2&nbsp;000"><span class="sfx">RSD</span></div>
    </div>

    <div class="stack g8">
      <span class="lbl" id="af-freq">Когда присылать</span>
      <div class="seg" role="group" aria-labelledby="af-freq">
        <button class="on" type="button" aria-pressed="true">Сразу</button>
        <button type="button" aria-pressed="false">Раз в день</button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--urgent)"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span class="grow" id="af-urgent">Только срочные</span>
        <button class="sw" type="button" role="switch" aria-checked="false" aria-labelledby="af-urgent"></button>
      </div>
      <button class="row" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c1 4 4 7 7 8M11 5c-1 4-4 7-7 8M13 21l4-10 4 10M14.5 17h5"/></svg>
        <span class="grow">Язык общения</span>
        <span class="t2">Русский</span>
        <svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <div class="row">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>
        <span class="grow stack" style="gap: 2px">
          <span id="af-quiet">Тихие часы 22:00–08:00</span>
          <span class="cap">Срочные заявки придут и ночью</span>
        </span>
        <button class="sw on" type="button" role="switch" aria-checked="true" aria-labelledby="af-quiet"></button>
      </div>
    </div>
  </main>

  <div class="mbar">
    <a class="mbtn" href="S18-alerts.dc.html">Сохранить подписку</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
