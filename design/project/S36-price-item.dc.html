<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9EBEE}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <header class="tgh">
    <a class="tgh-btn" href="S35-price-list.dc.html"><svg class="ic i24" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Назад</a>
    <div class="tgh-t"><b>Сосед</b><span>мини-приложение</span></div>
    <button class="tgh-btn r" type="button" aria-label="Меню"><svg class="ic fill i24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <main class="stack" style="padding: 12px 16px 124px; gap: 12px">
    <h1 class="h2">Позиция прайса</h1>

    <div class="fld">
      <label class="lbl" for="pi-name">Название</label>
      <input class="inp" id="pi-name" type="text" value="Установка люстры">
    </div>

    <div class="fld">
      <span class="lbl" id="pi-group">Группа</span>
      <button class="inp" type="button" aria-haspopup="listbox" aria-labelledby="pi-group pi-group-v" style="text-align: left">
        <span class="grow" id="pi-group-v">Люстры и карнизы</span>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text2)"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="fld">
      <span class="lbl" id="pi-price">Цена</span>
      <div class="seg" role="group" aria-labelledby="pi-price">
        <button type="button" aria-pressed="false">Фикс</button>
        <button class="on" type="button" aria-pressed="true">От</button>
        <button type="button" aria-pressed="false">За час</button>
      </div>
      <div class="inp focus"><input type="text" inputmode="numeric" value="2&nbsp;500" aria-label="Цена от, RSD"><span class="sfx">RSD</span></div>
      <div class="hstack" style="gap: 6px">
        <span class="hint">Обычно в Нови-Саде 1&nbsp;000–4&nbsp;000 RSD</span>
        <span class="bdg mute">v1</span>
      </div>
    </div>

    <div class="fld">
      <label class="lbl" for="pi-time">Длительность</label>
      <input class="inp" id="pi-time" type="text" value="1–2 часа">
    </div>

    <div class="fld">
      <label class="lbl" for="pi-desc">Описание</label>
      <textarea class="inp" id="pi-desc" rows="3" style="min-height: 90px">Сборка и подвес люстры до 5 рожков, подключение. Крюк или монтажная планка — по месту.</textarea>
    </div>

    <button class="btn dng full" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Удалить позицию</button>
  </main>

  <div class="mbar">
    <a class="mbtn" href="S35-price-list.dc.html">Сохранить</a>
  </div>
</div>
</x-dc>
