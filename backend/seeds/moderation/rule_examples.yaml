# Набор примеров для контент-правил (DEVELOPMENT_PLAN 2.4): текст → что должны сказать правила
# (content_rules.yaml вместе с детектором контактов и предоплаты). `make seeds-validate` и
# unit-тесты падают, если правка словаря ломает хоть один пример.
#
# action: block, shadow, flag или pass (правила молчат); categories — все сработавшие.
# Черновик ассистента — синтетика; реальные обезличенные примеры — K28.
examples:
