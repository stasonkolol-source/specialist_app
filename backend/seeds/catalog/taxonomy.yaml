# Таксономия первой волны — ЧЕРНОВИК для правок владельца (Q19, K21), утверждение — шаг 1.3b.
#
# - 5 категорий из PRODUCT.md «Пилот и категории первой волны»; детских занятий в MVP нет
#   (ADR-0018, §19.2 № 8), медицины и юристов — тоже.
# - name: ru и sr-Cyrl обязательны (CHECK в БД), sr-Latn генерируется из sr-Cyrl при загрузке,
#   если не задан явно; en — для поиска и v1.
# - price_hint: ориентиры в целых динарах (RSD) по городам из research/01 §4.2; загрузчик
#   переводит их в минимальные единицы (пара). unit: hour | job | visit | piece | service |
#   lesson | m2 | move.
# - terms: синонимы и разговорные формулировки для поиска и автодополнения (catalog.search_terms);
#   sr — латиницей или кириллицей, нормализация (латиница, без диакритики) — при загрузке.
# - risk_level: 0 — обычная, 1 — премодерация, 2 — запрещено.
# Проверка: cd backend && uv run python -m app.entrypoints.cli seeds-validate

