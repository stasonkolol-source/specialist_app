[project]
name = "sosed-backend"
version = "0.1.0"
description = "«Соседи» — backend: модульный монолит (FastAPI, aiogram, Procrastinate)"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.54",
    "sqlalchemy[asyncio]~=2.1.0",
    "psycopg[binary,pool]~=3.3",
    "alembic~=1.20",
    "geoalchemy2~=0.20",
    "shapely~=2.1",
    "pydantic>=2.13,<2.14",
    "pydantic-settings~=2.15",
    "dishka~=1.10",
    "aiogram~=3.31",
    "procrastinate~=3.10",
    "redis>=7.4,<8",
    "limits~=5.8",
    "pyjwt[crypto]~=2.15",
    # AES-256-GCM секретов в БД (8.4) и Ed25519 ключей JWT — напрямую, а не только через extra pyjwt;
    # без верхней границы: исправления безопасности cryptography выходят новыми мажорами
    "cryptography>=50",
    "structlog>=25",
    "sentry-sdk>=2",
    "prometheus-client>=0.22",
    "babel>=2.17",
    "typer>=0.16",
    "pyyaml~=6.0",
    "boto3~=1.40",
    "pillow~=12.3",
    "pillow-heif~=1.8",
    "anthropic>=1,<2",
    "sqladmin~=0.32",
    "pwdlib[argon2]~=0.3",
    "pyotp~=2.9",
    "itsdangerous~=2.2",
    "google-re2~=1.1",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6",
    "testcontainers~=4.15",
    "httpx>=0.28",
    "polyfactory>=2.22",
    "schemathesis>=4",
    "ruff~=0.16",
    "mypy~=2.3",
    "import-linter~=2.15",
    "copier>=9",
    "types-pyyaml>=6.0.12.20260906",
    "types-shapely>=2.1.0.20260728",
    "boto3-stubs[s3]>=1.43.103",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["src/app", "tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not bench"]  # бенчмарки — только `-m bench`
markers = [
    "unit: чистые тесты без I/O",
    "integration: тесты на настоящем PostgreSQL / Valkey / Garage (testcontainers)",
    "bench: бенчмарки, вручную",
    "authz: «чужой ресурс» — другой пользователь получает 404/403 (8.4, `pytest -m authz`)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "N",
          "DTZ", "T20", "ERA", "TID", "RET", "ARG", "FBT", "BLE", "G", "PERF", "PLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках, docstring и комментариях — норма проекта
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Время — только через порт Clock"
"datetime.datetime.utcnow".msg = "Время — только через порт Clock"
"uuid.uuid4".msg = "Идентификаторы — UUIDv7: platform.kernel.new_id()"
"os.getenv".msg = "Настройки — только platform/settings.py"
"os.environ".msg = "Настройки — только platform/settings.py"
"requests".msg = "Синхронный HTTP запрещён: httpx.AsyncClient в адаптере"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG", "FBT", "S608", "PT012"]
"tests/**" = ["S101", "ARG", "FBT", "S603", "S607", "S608", "TID251", "PT012"]
"tests/bench/**" = ["T201"]  # бенчмарк печатает замер (DEVELOPMENT_PLAN 4.1: «тест печатает число»)
"tests/integration/test_search_regression.py" = ["T201"]  # печатает долю и промахи (4.3b)
"src/app/platform/settings.py" = ["TID251"]
"src/app/platform/kernel/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/app"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
# WTForms (зависимость SQLAdmin) без аннотаций и stub-пакета: форма названий в админке (2.7b)
module = ["wtforms", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-re2 без аннотаций и stub-пакета: регулярки контент-правил (domain/rules.py, 2.7b)
module = ["re2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.*.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/tests/*"]
