{% extends "sqladmin/base.html" %}
{# Вход персонала (2.7a): логин, пароль и код TOTP — поверх шаблона SQLAdmin #}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100">
  <form class="col-lg-4 col-md-6 card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">{{ admin.title }}</h2>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="username">Логин</label>
        <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Пароль</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="otp">Код из приложения-аутентификатора</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" class="form-control" autocomplete="one-time-code" required>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
