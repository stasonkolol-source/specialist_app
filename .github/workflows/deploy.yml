# Деплой stage (DEVELOPMENT_PLAN 0.25c–0.25d, ARCHITECTURE §16.4): merge в main → образ (images.yml)
# → kamal deploy -d stage → wrangler deploy Mini App. Пока stage не заведён, ничего не делает: все
# job'ы ждут переменную репозитория STAGE_DEPLOY = 'true' (infra/runbooks/stage-bootstrap.md).
# Секреты и переменные — environment «stage» (Q1(б)): job получает их, только если запущен из main.
name: deploy-stage

on:
  # backend и Mini App: после сборки образов этого коммита (правки backend/ и infra/postgres/)
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  # только Mini App: правки фронтенда без backend
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'infra/workers/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy — выкатить; accessories — первый запуск PostgreSQL и Valkey; rollback — kamal rollback'
        type: choice
        options: [deploy, accessories, rollback]
        default: deploy
      version:
        description: 'sha образа: для rollback обязателен, для deploy — по умолчанию текущий main'
        required: false

concurrency:
  group: deploy-stage
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7b5be276aa17bbe122887f6a1ff12865f4848111989699b9786083be95d98415
  WRANGLER: wrangler@4.147.0

jobs:
  backend:
    name: backend (kamal)
    if: >-
      vars.STAGE_DEPLOY == 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: stage
    env:
      VERSION: ${{ inputs.version || github.event.workflow_run.head_sha || github.sha }}
      ACTION: ${{ inputs.action || 'deploy' }}
      # несекретное — Variables environment «stage»
      GHCR_OWNER: ${{ github.repository_owner }}
      STAGE_HOST: ${{ vars.STAGE_HOST }}
      STAGE_DOMAIN: ${{ vars.STAGE_DOMAIN }}
      STAGE_BOT_USERNAME: ${{ vars.STAGE_BOT_USERNAME }}
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      # GHCR — встроенный токен job'а (K16): образ скачивается во время деплоя
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # секреты — те же имена, что в infra/kamal/secrets.stage
      KAMAL_PROXY_SSL_CERT: ${{ secrets.KAMAL_PROXY_SSL_CERT }}
      KAMAL_PROXY_SSL_KEY: ${{ secrets.KAMAL_PROXY_SSL_KEY }}
      POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      MIGRATOR_DB_PASSWORD: ${{ secrets.MIGRATOR_DB_PASSWORD }}
      READONLY_DB_PASSWORD: ${{ secrets.READONLY_DB_PASSWORD }}
      BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      JWT_KEYS: ${{ secrets.JWT_KEYS }}
      APP_HASH_KEY: ${{ secrets.APP_HASH_KEY }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AI_OPENAI_API_KEY: ${{ secrets.AI_OPENAI_API_KEY }}
      AI_ANTHROPIC_API_KEY: ${{ secrets.AI_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # deploy-ключ stage (K15) — только в агенте, на диск не пишется
      - name: ssh agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock" >> "$GITHUB_ENV"
          ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock" > /dev/null
          SSH_AUTH_SOCK="$RUNNER_TEMP/ssh-agent.sock" ssh-add - <<< "$DEPLOY_SSH_KEY"

      - name: kamal ${{ env.ACTION }}
        run: |
          case "$ACTION" in
            deploy) args=(deploy --skip-push --version "$VERSION") ;;
            accessories) args=(accessory boot all) ;;
            rollback) args=(rollback "$VERSION") ;;
          esac
          names=$(sed -n 's/^\([A-Z][A-Z0-9_]*\)=\$\1$/\1/p' infra/kamal/secrets.stage)
          pass=()
          for name in GHCR_OWNER STAGE_HOST STAGE_DOMAIN STAGE_BOT_USERNAME R2_ACCOUNT_ID SENTRY_DSN $names; do
            pass+=(-e "$name")
          done
          docker run --rm -v "$PWD:/workdir" -w /workdir \
            -v "$SSH_AUTH_SOCK:/ssh-agent" -e SSH_AUTH_SOCK=/ssh-agent \
            -e APP_RELEASE="$VERSION" "${pass[@]}" \
            "$KAMAL_IMAGE" "${args[@]}" -d stage -c infra/kamal/deploy.yml

  mini-app:
    name: Mini App (wrangler)
    needs: backend
    # после backend, если он был; правка только фронтенда — без него
    if: >-
      vars.STAGE_DEPLOY == 'true' && !cancelled() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: stage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # push затронул и backend: Mini App выкатит запуск после images, вместе с новым API
      - name: backend in this push?
        id: guard
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE"
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(backend/|infra/postgres/|\.github/workflows/images\.yml)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - name: build (VITE_* — Variables environment «stage»)
        if: steps.guard.outputs.skip != 'true'
        env:
          VITE_MEDIA_ORIGINS: https://stage-cdn.${{ vars.STAGE_DOMAIN }}
          TMA_STORAGE_ORIGINS: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          VITE_SENTRY_DSN: ${{ vars.TMA_SENTRY_DSN }}
          VITE_TELEGRAM_BOT: ${{ vars.STAGE_BOT_USERNAME }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -F tma build

      # карты исходников и manifest Vite наружу не отдаём
      - name: wrangler deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: https://stage-api.${{ vars.STAGE_DOMAIN }}
        run: |
          printf '.vite\n*.map\n' > apps/tma/dist/.assetsignore
          npx --yes "$WRANGLER" deploy --config infra/workers/tma/wrangler.jsonc --env stage \
            --var "API_ORIGIN:$API_ORIGIN"
