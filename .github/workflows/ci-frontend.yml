# CI frontend (DEVELOPMENT_PLAN 0.16b): те же проверки, что make check-frontend локально.
# Дальше сюда добавляются: diff api-client (0.20), Playwright (0.19a, 0.21b), бюджет бандла (0.21b), pnpm audit (0.23).
name: ci-frontend

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'design/ui.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.prettierignore'
      - 'make/frontend.mk'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'design/ui.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.prettierignore'
      - 'make/frontend.mk'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # pnpm той же версии, что локально: packageManager в package.json через corepack
      - name: pnpm (corepack)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: prettier
        run: pnpm format:check

      - name: typecheck, lint, test
        run: pnpm turbo run typecheck lint test

      - name: token contrast
        run: pnpm -F design-tokens check:contrast

      - name: i18n catalogs
        run: pnpm -F i18n i18n:check

  # Скриншоты галереи ui-web: тот же образ Playwright, что у make e2e, — эталоны совпадают с локальными.
  # На PR только chromium и галерея; полная матрица экранов — с 0.21b.
  ui-web-e2e:
    name: ui-web screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7.0.1

      - name: pnpm (corepack)
        run: |
          corepack enable
          pnpm --version

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build gallery
        run: pnpm -F ui-web e2e:build

      - name: playwright
        run: pnpm -F ui-web e2e

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ui-web-playwright-report
          path: |
            packages/ui-web/playwright-report
            packages/ui-web/test-results
          retention-days: 7
