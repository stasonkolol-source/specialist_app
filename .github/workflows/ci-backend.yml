# CI backend (DEVELOPMENT_PLAN 0.5b): те же проверки, что make check локально.
# Интеграционные тесты — на тех же testcontainers и нашем образе PostGIS.
name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "packages/links/**" # golden-векторы deep links читает тест кодека growth
      - "infra/postgres/**"
      - "infra/compose/garage.toml"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/links/**"
      - "infra/postgres/**"
      - "infra/compose/garage.toml"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: mypy (strict)
        run: uv run mypy

      - name: import-linter contracts
        run: uv run lint-imports --no-cache

      - name: unit tests
        run: uv run pytest -m unit -q

      - name: OpenAPI contract is up to date (make openapi)
        run: uv run python -m app.entrypoints.cli openapi --check

      - name: i18n catalogs (sr_Latn generated, ru = sr_Cyrl keys)
        run: uv run python -m app.entrypoints.cli i18n check

      - name: seeds (geo, taxonomy, queries)
        run: uv run python -m app.entrypoints.cli seeds-validate

      - uses: docker/setup-buildx-action@v4.4.1

      - name: PostgreSQL + PostGIS image (layer cache in GitHub Actions)
        uses: docker/build-push-action@v7.4.0
        with:
          context: infra/postgres
          load: true
          tags: specialist/postgres-postgis:18.6-3.6
          cache-from: type=gha,scope=pg-image
          cache-to: type=gha,scope=pg-image,mode=max

      - name: ffmpeg (обработка видео, шаг 2.2b)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: integration tests (testcontainers)
        run: uv run pytest -m integration -q

  openapi-diff:
    # До ворот беты (6.7) — предупреждение: ломающее изменение допустимо с меткой
    # api-breaking в PR и перегенерацией клиента; с 6.7 шаг станет блокирующим.
    name: OpenAPI breaking changes (warning)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: oasdiff against main
        env:
          OASDIFF_VERSION: "1.32.1"
          OASDIFF_SHA256: "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f"
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:backend/openapi.json" > /tmp/base.json 2>/dev/null; then
            echo "no openapi.json in ${BASE_REF} yet — nothing to compare"; exit 0
          fi
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" oasdiff
          ./oasdiff breaking /tmp/base.json backend/openapi.json --fail-on ERR

  repo:
    name: plan and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: plan-check
        run: python3 scripts/plan_check.py

      - name: gitleaks (git history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .
