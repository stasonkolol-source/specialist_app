# Обновления зависимостей (DEVELOPMENT_PLAN 0.23). Раз в неделю, группами — меньше PR и минут CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-patch:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-patch:
        update-types: [patch, minor]

  - package-ecosystem: docker
    directories: [/backend, /infra/postgres]
    schedule: { interval: weekly, day: monday }
