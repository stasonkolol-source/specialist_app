# Garage v2.x single-node config for local development (lab only: secrets are not secret).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "4f6c8a2f0e1d9b7c3a5e8d1f2b4c6a8e0d2f4b6c8a0e2d4f6b8c0a2e4d6f8b0c"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "lab-admin-token"
metrics_token = "lab-metrics-token"
