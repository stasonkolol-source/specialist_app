# Destination stage (DEVELOPMENT_PLAN 0.25c): одна VM CX23 из infra/terraform/stage.
# Из окружения: STAGE_HOST — IPv4 VM (make tf ENV=stage ARGS='output stage_ipv4'), STAGE_DOMAIN —
# домен (Q9), STAGE_BOT_USERNAME — stage-бот без @ (K17), R2_ACCOUNT_ID — Account ID Cloudflare
# (K11), SENTRY_DSN — DSN backend (K20, не секрет). В CI — Variables environment «stage».
servers:
  web:
    hosts:
      - <%= ENV.fetch("STAGE_HOST") %>
  bot:
    hosts:
      - <%= ENV.fetch("STAGE_HOST") %>
    # webhook Telegram на своём хосте (тот же сертификат Origin CA, Terraform stage); ключ — host,
    # как у proxy ниже: Kamal не принимает host и hosts в одном (слитом) proxy
    proxy:
      host: stage-bot.<%= ENV.fetch("STAGE_DOMAIN") %>
      ssl:
        certificate_pem: KAMAL_PROXY_SSL_CERT
        private_key_pem: KAMAL_PROXY_SSL_KEY
  worker:
    hosts:
      - <%= ENV.fetch("STAGE_HOST") %>
  worker-media:
    hosts:
      - <%= ENV.fetch("STAGE_HOST") %>

proxy:
  # API (web); бот — свой хост выше; stage-admin. kamal-proxy не обслуживает до Access (K31, 2.7b)
  host: stage-api.<%= ENV.fetch("STAGE_DOMAIN") %>
  ssl:
    certificate_pem: KAMAL_PROXY_SSL_CERT
    private_key_pem: KAMAL_PROXY_SSL_KEY

env:
  clear:
    APP_ENV: stage
    APP_API_PUBLIC_URL: https://stage-api.<%= ENV.fetch("STAGE_DOMAIN") %>
    # web доверяет X-Forwarded-* только kamal-proxy: сеть «kamal» с подсетью из Terraform
    # (docker_network_cidr). Края Cloudflare — APP_CLOUDFLARE_IPS по умолчанию (settings.py).
    APP_TRUSTED_PROXIES: '["172.30.0.0/24"]'
    # апдейты бота — webhook с secret_token на хост роли bot (0.25e); откат на long polling —
    # `polling` и `proxy: false` у роли bot выше. bot-setup в контейнере web видит те же значения
    TELEGRAM_UPDATES: webhook
    TELEGRAM_WEBHOOK_BASE_URL: https://stage-bot.<%= ENV.fetch("STAGE_DOMAIN") %>
    TELEGRAM_BOT_USERNAME: <%= ENV.fetch("STAGE_BOT_USERNAME") %>
    TELEGRAM_MINI_APP_URL: https://stage-app.<%= ENV.fetch("STAGE_DOMAIN") %>
    S3_ENDPOINT_URL: https://<%= ENV.fetch("R2_ACCOUNT_ID") %>.eu.r2.cloudflarestorage.com
    S3_PUBLIC_ENDPOINT_URL: https://<%= ENV.fetch("R2_ACCOUNT_ID") %>.eu.r2.cloudflarestorage.com
    S3_PUBLIC_BASE_URL: https://stage-cdn.<%= ENV.fetch("STAGE_DOMAIN") %>
    S3_BUCKET_INCOMING: sosed-stage-incoming
    S3_BUCKET_MEDIA: sosed-stage-media
    S3_BUCKET_PRIVATE: sosed-stage-private
    SENTRY_DSN: '<%= ENV.fetch("SENTRY_DSN", "") %>'

# PostgreSQL на stage — accessory на той же VM (ADR-0015); на prod БД живёт на db-1, поэтому
# accessory описан здесь, а не в deploy.yml.
accessories:
  postgres:
    host: <%= ENV.fetch("STAGE_HOST") %>
    # наш образ из images.yml: PostgreSQL 18 + PostGIS, initdb с builtin C.UTF-8 (ADR-0005)
    image: ghcr.io/<%= ENV.fetch("GHCR_OWNER") %>/sosed-postgres:18.6-3.6
    cmd: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c random_page_cost=1.1
      -c jit=off
      -c max_connections=100
      -c log_min_duration_statement=500
    # Первый старт на пустом томе: initdb, затем infra/postgres/bootstrap.sql из образа
    # (/docker-entrypoint-initdb.d) — роли, их параметры и расширения, как в dev.
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: specialist
      secret:
        - POSTGRES_PASSWORD:POSTGRES_SUPERUSER_PASSWORD
        - APP_DB_PASSWORD
        - MIGRATOR_DB_PASSWORD
        - READONLY_DB_PASSWORD
        - BACKUP_DB_PASSWORD
    directories:
      - postgres-data:/var/lib/postgresql
    options:
      memory: 1g
      shm-size: 256m
      cpuset-cpus: "0-1"

  valkey:
    host: <%= ENV.fetch("STAGE_HOST") %>
