# Destination production (DEVELOPMENT_PLAN 3.1c, ADR-0015): процессы и Valkey — на app-1 (CX33), БД —
# PostgreSQL на db-1 в приватной сети (infra/terraform/prod, infra/postgres/provision.sh), поэтому
# PostgreSQL accessory здесь нет. Релиз — только вручную: deploy-production (.github/workflows/deploy.yml).
# Из окружения: PROD_HOST — IPv4 app-1 (make tf ENV=prod ARGS='output app_ipv4'), PROD_DB_IP — адрес
# db-1 в приватной сети (pre-deploy и DSN в secrets.production), PROD_DOMAIN — домен (Q8, Q9),
# PROD_BOT_USERNAME — prod-бот без @ (K40a), R2_ACCOUNT_ID (K11), SENTRY_DSN (K20),
# PROD_MODERATORS_CHAT_ID — prod-чат модераторов (K29), ADMIN_HOST — admin.<домен>, только когда
# Access включён (K31), LEGAL_OPERATOR_NAME и LEGAL_CONTACT_EMAIL — оператор данных и почта поддержки
# (K22, обязательны), TELEGRAM_SUPPORT_USERNAME — аккаунт поддержки (K23). В CI — Variables
# environment «production».
#
# Бот на проде — webhook (ADR-0011, 0.25e): апдейты на bot.<домен>/integrations/telegram/webhook —
# свой хост роли bot в kamal-proxy (Kamal не даёт двум ролям один хост с TLS), skip-правило WAF —
# infra/terraform/zone, секрет — TELEGRAM_WEBHOOK_SECRET. Откат на long polling —
# TELEGRAM_UPDATES=polling вместе с `proxy: false` у роли bot (polling не отвечает на /up).

# Лимиты под CPX22 (2 vCPU, 4 GB) без БД на машине — 12 октября старая линейка CX33 (4 vCPU, 8 GB)
# в DE распродана. Все роли делят два ядра (своего ядра у ffmpeg нет); сумма памяти ролей и
# accessories ≈ 3,1 GB из 4. cpuset, а не cpus (§16.1). На CX33/CPX32 вернуть: web 1536m 0-2,
# bot 384m 0-2, worker 768m 0-2, worker-media 1536m 3, valkey 448m 0-2, alloy 384m 0-2.
servers:
  web:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>
    options:
      memory: 1024m
      cpuset-cpus: "0-1"
  bot:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>
    # ключ — hosts, как у proxy ниже: Kamal не принимает host и hosts в одном (слитом) proxy
    proxy:
      hosts:
        - bot.<%= ENV.fetch("PROD_DOMAIN") %>
      ssl:
        certificate_pem: KAMAL_PROXY_SSL_CERT
        private_key_pem: KAMAL_PROXY_SSL_KEY
    options:
      memory: 256m
      cpuset-cpus: "0-1"
  worker:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>
    options:
      memory: 512m
      cpuset-cpus: "0-1"
  worker-media:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>
    options:
      memory: 768m
      cpuset-cpus: "0-1"

proxy:
  # API (web); бот — свой хост выше; admin.<домен> — только за Access: ADMIN_HOST задаёт деплой (K31)
  hosts:
    - api.<%= ENV.fetch("PROD_DOMAIN") %>
    # <% if ENV["ADMIN_HOST"].to_s != "" %>
    - <%= ENV["ADMIN_HOST"] %>
    # <% end %>
  ssl:
    certificate_pem: KAMAL_PROXY_SSL_CERT
    private_key_pem: KAMAL_PROXY_SSL_KEY

env:
  clear:
    APP_ENV: production
    APP_API_PUBLIC_URL: https://api.<%= ENV.fetch("PROD_DOMAIN") %>
    # ссылка «Открыть в админке» под карточкой кейса в чате модераторов (2.5b) — только с Access
    # <% if ENV["ADMIN_HOST"].to_s != "" %>
    APP_ADMIN_PUBLIC_URL: https://<%= ENV["ADMIN_HOST"] %>/admin
    # <% end %>
    # web доверяет X-Forwarded-* только kamal-proxy: сеть «kamal» с подсетью из Terraform
    # (docker_network_cidr). Края Cloudflare — APP_CLOUDFLARE_IPS по умолчанию (settings.py).
    APP_TRUSTED_PROXIES: '["172.30.0.0/24"]'
    # апдейты бота — webhook с secret_token на хост роли bot (0.25e)
    TELEGRAM_UPDATES: webhook
    TELEGRAM_WEBHOOK_BASE_URL: https://bot.<%= ENV.fetch("PROD_DOMAIN") %>
    TELEGRAM_BOT_USERNAME: <%= ENV.fetch("PROD_BOT_USERNAME") %>
    TELEGRAM_MINI_APP_URL: https://app.<%= ENV.fetch("PROD_DOMAIN") %>
    TELEGRAM_MODERATORS_CHAT_ID: '<%= ENV.fetch("PROD_MODERATORS_CHAT_ID", "") %>'
    S3_ENDPOINT_URL: https://<%= ENV.fetch("R2_ACCOUNT_ID") %>.eu.r2.cloudflarestorage.com
    S3_PUBLIC_ENDPOINT_URL: https://<%= ENV.fetch("R2_ACCOUNT_ID") %>.eu.r2.cloudflarestorage.com
    S3_PUBLIC_BASE_URL: https://cdn.<%= ENV.fetch("PROD_DOMAIN") %>
    S3_BUCKET_INCOMING: sosed-prod-incoming
    S3_BUCKET_MEDIA: sosed-prod-media
    S3_BUCKET_PRIVATE: sosed-prod-private
    SENTRY_DSN: '<%= ENV.fetch("SENTRY_DSN", "") %>'
    # Правовые документы (1.5a, K22): оператор данных и почта поддержки подставляются в политику
    # конфиденциальности, с заглушкой процесс на проде не стартует (settings.py). Поэтому без умолчания
    # и с проверкой на пустоту (в CI незаданная Variable — пустая строка, а не отсутствие): нет значения —
    # падает уже `kamal config`, а не web после выкатки. Условие ERB — в комментарии YAML, как у ADMIN_HOST
    # <% %w[LEGAL_OPERATOR_NAME LEGAL_CONTACT_EMAIL].each { |n| raise KeyError, "#{n} пуст: задайте Variable environment «production» (K22, prod-bootstrap.md, раздел 4)" if ENV[n].to_s.empty? } %>
    LEGAL_OPERATOR_NAME: <%= ENV.fetch("LEGAL_OPERATOR_NAME").to_json %>
    LEGAL_CONTACT_EMAIL: '<%= ENV.fetch("LEGAL_CONTACT_EMAIL") %>'
    # аккаунт поддержки для /help (K23, без @) — Variable SUPPORT_USERNAME; пусто — «контакт появится скоро»
    TELEGRAM_SUPPORT_USERNAME: '<%= ENV.fetch("TELEGRAM_SUPPORT_USERNAME", "") %>'
    # пул на процесс: web, bot, worker и worker-media вместе — до 60 соединений из 100
    DB_POOL_SIZE: "10"
    DB_POOL_MAX_OVERFLOW: "5"

accessories:
  valkey:
    host: <%= ENV.fetch("PROD_HOST") %>
    cmd: valkey-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction
    options:
      memory: 256m
      cpuset-cpus: "0-1"

  # Alloy (3.3) — только на app-1: он же читает db-1 по приватной сети — PostgreSQL ролью monitoring и
  # node exporter из пакета ОС (provision.sh, порт 9100 только для подсети prod). На db-1 нет Docker и
  # секретов Grafana Cloud, а логи PostgreSQL (тексты медленных запросов с литералами) не уходят с VM.
  # <% if ENV["GRAFANA_CLOUD_PROM_URL"].to_s != "" %>
  alloy:
    host: <%= ENV.fetch("PROD_HOST") %>
    files:
      - infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - infra/monitoring/alloy/db-1.alloy:/etc/alloy/db-1.alloy
    env:
      clear:
        ALLOY_ENV: production
        ALLOY_HOST: app-1
        DB_NODE_TARGET: <%= ENV.fetch("PROD_DB_IP") %>:9100
    options:
      memory: 256m
      cpuset-cpus: "0-1"
  # <% end %>
