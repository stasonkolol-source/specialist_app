packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
# Скрипты установки не нужны: бинарь esbuild приходит optional-зависимостью платформы,
# service worker MSW в браузер не кладём (моки — в тестах через msw/node).
allowBuilds:
  esbuild: false
  msw: false

# undici < 7.29 — уязвимости (GHSA-35p6-xmwp-9g52 и др.) в транзитивной зависимости orval
# (генерация api-client, в сборку не попадает). Снять, когда orval подтянет исправленную версию.
overrides:
  undici: '>=7.29.1 <8'
